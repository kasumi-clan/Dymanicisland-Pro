
name: Build Godly Island APK (debug)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if needed)
        id: loc
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR="."
          else
            ZIP="./GodlyIsland-island.zip"

            if [ ! -f "$ZIP" ]; then
              echo "::error::Khong thay file GodlyIsland-island.zip o thu muc goc repo"
              exit 1
            fi

            echo "Giai nen: $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src

            FOUND="$(find _src -name settings.gradle.kts | head -n 1)"
            if [ -z "$FOUND" ]; then
              echo "::error::Trong GodlyIsland-island.zip khong co settings.gradle.kts"
              exit 1
            fi

            DIR="$(dirname "$FOUND")"
          fi

          echo "Thu muc du an: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodlyIsland-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GodlyIsland-build-reports
          path: ${{ steps.loc.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
